[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highway-planner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "highway-env>=1.9",
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "imitation>=1.0",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "matplotlib>=3.8",
    "imageio[ffmpeg]>=2.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
